name: AiNiee checks

'on':
  workflow_dispatch:
  pull_request:
  push:
    branches: [main, feat-dev-ui]

permissions:
  contents: read

concurrency:
  group: checks-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: windows-latest
    timeout-minutes: 40
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: |
            requirements.txt
            requirements_no_deps.txt

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install backend dependencies
        run: |
          python -m pip install --upgrade pip setuptools wheel
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          python -m pip install -r requirements.txt
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          python -m pip install --no-deps -r requirements_no_deps.txt
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Install frontend dependencies
        working-directory: frontend
        run: npm ci

      - name: Backend tests and OpenAPI contract
        run: python -m pytest -q

      - name: Frontend tests, build and generated types
        working-directory: frontend
        run: |
          npm test
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          npm run build
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          npm run check:api
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Install test browser
        working-directory: frontend
        run: npx playwright install chromium

      - name: Browser workflows and 50,000-item project
        working-directory: frontend
        env:
          AINIEE_TEST_PYTHON: ${{ env.pythonLocation }}/python.exe
        run: npm run test:e2e

      - name: Upload test diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-diagnostics
          path: frontend/test-results/
          if-no-files-found: ignore
          retention-days: 7
